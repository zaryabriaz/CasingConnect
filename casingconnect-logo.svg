<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920" role="img">
  <title>CasingConnect logo</title>
  <desc>Horizontal, stacked, and icon lockups. Full color, monochrome, and dark background.</desc>
  <rect width="1080" height="920" fill="#F7F5EC"/>

  <g font-family="Liberation Sans, Helvetica, Arial, sans-serif">
    <g font-size="11" font-weight="700" letter-spacing="1.8" fill="#8A8172">
      <text x="64" y="44">HORIZONTAL</text>
      <text x="760" y="44">STACKED</text>
      <text x="64" y="250">ICON</text>
      <text x="220" y="250">ICON, MONOCHROME</text>
      <text x="430" y="250">ICON, ON DARK</text>
      <text x="64" y="460">HORIZONTAL, MONOCHROME</text>
      <text x="64" y="620">HORIZONTAL, ON DARK</text>
      <text x="740" y="620">STACKED, ON DARK</text>
    </g>

    <!-- Horizontal, full color -->
    <g id="horizontal" transform="translate(64 68)">
      <g transform="scale(1.3125)">
        <circle cx="43" cy="32" r="8" fill="none" stroke="#C39A4A" stroke-width="5"/>
        <ellipse cx="25" cy="32" rx="11" ry="18" fill="none" stroke="#185747" stroke-width="6"/>
      </g>
      <text x="108" y="48" font-size="36" font-weight="700">
        <tspan fill="#185747">Casing</tspan><tspan fill="#C39A4A">Connect</tspan>
      </text>
      <text x="108" y="72" font-size="13" fill="#4E6358">Connecting the Natural Casing Industry</text>
    </g>

    <!-- Stacked, full color -->
    <g id="stacked" transform="translate(760 68)">
      <g transform="translate(78 0) scale(1.125)">
        <circle cx="43" cy="32" r="8" fill="none" stroke="#C39A4A" stroke-width="5"/>
        <ellipse cx="25" cy="32" rx="11" ry="18" fill="none" stroke="#185747" stroke-width="6"/>
      </g>
      <text x="114" y="112" text-anchor="middle" font-size="32" font-weight="700">
        <tspan fill="#185747">Casing</tspan><tspan fill="#C39A4A">Connect</tspan>
      </text>
      <text x="114" y="136" text-anchor="middle" font-size="12" fill="#4E6358">Connecting the Natural Casing Industry</text>
    </g>

    <!-- Icons -->
    <g id="icon" transform="translate(64 268) scale(1.5)">
      <circle cx="43" cy="32" r="8" fill="none" stroke="#C39A4A" stroke-width="5"/>
      <ellipse cx="25" cy="32" rx="11" ry="18" fill="none" stroke="#185747" stroke-width="6"/>
    </g>
    <g id="icon-mono" transform="translate(220 268) scale(1.5)">
      <circle cx="43" cy="32" r="8" fill="none" stroke="#185747" stroke-width="5"/>
      <ellipse cx="25" cy="32" rx="11" ry="18" fill="none" stroke="#185747" stroke-width="6"/>
    </g>
    <rect x="430" y="268" width="140" height="140" rx="24" fill="#10241C"/>
    <g id="icon-dark" transform="translate(452 290) scale(1.5)">
      <circle cx="43" cy="32" r="8" fill="none" stroke="#C39A4A" stroke-width="5"/>
      <ellipse cx="25" cy="32" rx="11" ry="18" fill="none" stroke="#F7F5EC" stroke-width="6"/>
    </g>

    <!-- Horizontal, monochrome -->
    <g id="horizontal-mono" transform="translate(64 484)">
      <g transform="scale(1.125)">
        <circle cx="43" cy="32" r="8" fill="none" stroke="#185747" stroke-width="5"/>
        <ellipse cx="25" cy="32" rx="11" ry="18" fill="none" stroke="#185747" stroke-width="6"/>
      </g>
      <text x="96" y="40" font-size="32" font-weight="700" fill="#185747">CasingConnect</text>
      <text x="96" y="62" font-size="13" fill="#185747">Connecting the Natural Casing Industry</text>
    </g>

    <!-- Horizontal, on dark -->
    <g id="horizontal-dark">
      <rect x="64" y="640" width="640" height="120" rx="28" fill="#10241C"/>
      <g transform="translate(88 658) scale(1.3125)">
        <circle cx="43" cy="32" r="8" fill="none" stroke="#C39A4A" stroke-width="5"/>
        <ellipse cx="25" cy="32" rx="11" ry="18" fill="none" stroke="#F7F5EC" stroke-width="6"/>
      </g>
      <text x="196" y="706" font-size="36" font-weight="700">
        <tspan fill="#F7F5EC">Casing</tspan><tspan fill="#C39A4A">Connect</tspan>
      </text>
      <text x="196" y="730" font-size="13" fill="#D7E0D8">Connecting the Natural Casing Industry</text>
    </g>

    <!-- Stacked, on dark -->
    <g id="stacked-dark">
      <rect x="740" y="640" width="280" height="240" rx="28" fill="#10241C"/>
      <g transform="translate(824 664) scale(1.125)">
        <circle cx="43" cy="32" r="8" fill="none" stroke="#C39A4A" stroke-width="5"/>
        <ellipse cx="25" cy="32" rx="11" ry="18" fill="none" stroke="#F7F5EC" stroke-width="6"/>
      </g>
      <text x="880" y="776" text-anchor="middle" font-size="28" font-weight="700">
        <tspan fill="#F7F5EC">Casing</tspan><tspan fill="#C39A4A">Connect</tspan>
      </text>
      <text x="880" y="800" text-anchor="middle" font-size="12" fill="#D7E0D8">Connecting the Natural Casing Industry</text>
    </g>
  </g>
</svg>
