server {
  listen 80;
  server_name casingconnect.com www.casingconnect.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://casingconnect.com$request_uri;
  }
}

# Canonical host: apex (non-www)
server {
  listen 443 ssl;
  http2 on;
  server_name www.casingconnect.com;

  ssl_certificate /etc/letsencrypt/live/casingconnect.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/casingconnect.com/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://casingconnect.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name casingconnect.com;

  ssl_certificate /etc/letsencrypt/live/casingconnect.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/casingconnect.com/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 20m;

  # Docker embedded DNS — re-resolve api/web after container recreates (avoids stale 502)
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:3010;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /uploads/ {
    set $api_upstream http://api:3010;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Static sitemap — instant, no Next/API dependency (fixes GSC "Couldn't fetch")
  location = /sitemap.xml {
    alias /etc/nginx/sitemap.xml;
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff";
  }

  location = /sitemap/sitemap.xml {
    alias /etc/nginx/sitemap.xml;
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff";
  }

  location / {
    set $web_upstream http://web:3011;
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
